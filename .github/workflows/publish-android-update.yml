name: Publish Android Update

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "APP_UPDATE_VERSION_CODE"
        required: true
        type: string
      version_name:
        description: "APP_UPDATE_VERSION_NAME"
        required: true
        type: string
      changelog:
        description: "APP_UPDATE_CHANGELOG"
        required: false
        default: ""
        type: string
      critical:
        description: "APP_UPDATE_CRITICAL"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEPLOY_USE_CLOUDFLARE: ${{ secrets.DEPLOY_USE_CLOUDFLARE }}
      DEPLOY_HOST_RAW: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT_RAW: ${{ secrets.DEPLOY_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write release keystore
        env:
          APP_RELEASE_KEYSTORE_BASE64: ${{ secrets.APP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.keystore
          printf '%s' "$APP_RELEASE_KEYSTORE_BASE64" | base64 -d > ~/.keystore/lexicon-release.jks

      - name: Configure release signing
        run: |
          {
            echo "APP_RELEASE_KEYSTORE_FILE=$HOME/.keystore/lexicon-release.jks"
            echo "APP_RELEASE_KEYSTORE_PASSWORD=${{ secrets.APP_RELEASE_KEYSTORE_PASSWORD }}"
            echo "APP_RELEASE_KEY_ALIAS=${{ secrets.APP_RELEASE_KEY_ALIAS }}"
            echo "APP_RELEASE_KEY_PASSWORD=${{ secrets.APP_RELEASE_KEY_PASSWORD }}"
            echo "APP_RELEASE_KEYSTORE_TYPE=JKS"
          } >> "$GITHUB_ENV"

      - name: Build release APK (bash wrapper v2)
        run: |
          echo "WORKFLOW_MARKER=build-step-bash-wrapper-v2"
          bash ./gradlew assembleRelease

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 - <<'PY'
import os
from pathlib import Path

key = os.environ["DEPLOY_SSH_KEY"]
key = key.replace("\r", "").strip()
if key.startswith('"') and key.endswith('"'):
    key = key[1:-1]
key = key.replace("\\n", "\n")
Path.home().joinpath(".ssh", "id_ed25519").write_text(key + "\n", encoding="utf-8", newline="\n")
PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Install cloudflared (for tunnel SSH)
        if: ${{ env.DEPLOY_USE_CLOUDFLARE == 'true' }}
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare SSH proxy
        if: ${{ env.DEPLOY_USE_CLOUDFLARE == 'true' }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_HOST_RAW: ${{ secrets.DEPLOY_HOST }}
        run: |
          nohup cloudflared access tcp \
            --hostname "$DEPLOY_HOST_RAW" \
            --url 127.0.0.1:52222 \
            --service-token-id "$CF_ACCESS_CLIENT_ID" \
            --service-token-secret "$CF_ACCESS_CLIENT_SECRET" \
            > /tmp/cloudflared-deploy.log 2>&1 &
          sleep 3

      - name: Add known host
        env:
          DEPLOY_HOST_RAW: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT_RAW: ${{ secrets.DEPLOY_PORT }}
        run: |
          if [[ "${DEPLOY_USE_CLOUDFLARE}" == "true" ]]; then
            TARGET_HOST="127.0.0.1"
            TARGET_PORT="52222"
          else
            TARGET_HOST="${DEPLOY_HOST_RAW}"
            TARGET_PORT="${DEPLOY_PORT_RAW:-22}"
          fi
          ssh-keyscan -p "$TARGET_PORT" "$TARGET_HOST" >> ~/.ssh/known_hosts

      - name: Publish APK and metadata
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_RAW: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT_RAW: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_TARGET_OS: ${{ secrets.DEPLOY_TARGET_OS }}
          DEPLOY_RELEASE_DIR: ${{ secrets.DEPLOY_RELEASE_DIR }}
          DEPLOY_ENV_PATH: ${{ secrets.DEPLOY_ENV_PATH }}
          DEPLOY_RESTART_CMD: ${{ secrets.DEPLOY_RESTART_CMD }}
          APP_UPDATE_DOWNLOAD_URL: ${{ secrets.APP_UPDATE_DOWNLOAD_URL }}
          APP_UPDATE_PUBLIC_METADATA: ${{ secrets.APP_UPDATE_PUBLIC_METADATA }}
          APP_UPDATE_PUBLIC_DOWNLOAD: ${{ secrets.APP_UPDATE_PUBLIC_DOWNLOAD }}
        run: |
          if [[ "${DEPLOY_USE_CLOUDFLARE}" == "true" ]]; then
            export DEPLOY_HOST="127.0.0.1"
            export DEPLOY_PORT="52222"
          else
            export DEPLOY_HOST="${DEPLOY_HOST_RAW}"
            export DEPLOY_PORT="${DEPLOY_PORT_RAW:-22}"
          fi

          bash scripts/publish-android-update.sh \
            --apk app/build/outputs/apk/release/app-release.apk \
            --version-code "${{ inputs.version_code }}" \
            --version-name "${{ inputs.version_name }}" \
            --changelog "${{ inputs.changelog }}" \
            --critical "${{ inputs.critical }}" \
            --target-os "${DEPLOY_TARGET_OS:-windows}" \
            --download-url "${APP_UPDATE_DOWNLOAD_URL:-https://api.alex-dyakin.com/api/app/download/latest}" \
            --public-metadata "${APP_UPDATE_PUBLIC_METADATA:-false}" \
            --public-download "${APP_UPDATE_PUBLIC_DOWNLOAD:-false}"
