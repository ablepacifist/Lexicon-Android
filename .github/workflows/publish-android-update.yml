name: Publish Android Update

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "APP_UPDATE_VERSION_CODE"
        required: true
        type: string
      version_name:
        description: "APP_UPDATE_VERSION_NAME"
        required: true
        type: string
      changelog:
        description: "APP_UPDATE_CHANGELOG"
        required: false
        default: ""
        type: string
      critical:
        description: "APP_UPDATE_CRITICAL"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: publish-android-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_USE_CLOUDFLARE: ${{ secrets.DEPLOY_USE_CLOUDFLARE }}
      CF_PROXY_PORT: "52222"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Write release keystore
        env:
          APP_RELEASE_KEYSTORE_BASE64: ${{ secrets.APP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "::error::APP_RELEASE_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi
          mkdir -p "$HOME/.keystore"
          printf '%s' "$APP_RELEASE_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 -d > "$HOME/.keystore/lexicon-release.jks"
          chmod 600 "$HOME/.keystore/lexicon-release.jks"
          if [[ ! -s "$HOME/.keystore/lexicon-release.jks" ]]; then
            echo "::error::Decoded keystore is empty - check the base64 secret."
            exit 1
          fi

      - name: Configure release signing
        env:
          APP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.APP_RELEASE_KEYSTORE_PASSWORD }}
          APP_RELEASE_KEY_ALIAS: ${{ secrets.APP_RELEASE_KEY_ALIAS }}
          APP_RELEASE_KEY_PASSWORD: ${{ secrets.APP_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "APP_RELEASE_KEYSTORE_FILE=$HOME/.keystore/lexicon-release.jks"
            echo "APP_RELEASE_KEYSTORE_PASSWORD=$APP_RELEASE_KEYSTORE_PASSWORD"
            echo "APP_RELEASE_KEY_ALIAS=$APP_RELEASE_KEY_ALIAS"
            echo "APP_RELEASE_KEY_PASSWORD=$APP_RELEASE_KEY_PASSWORD"
            echo "APP_RELEASE_KEYSTORE_TYPE=JKS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon assembleRelease

      - name: Locate release APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::Release APK not found at $APK"
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"
          echo "Built $APK ($(stat -c %s "$APK") bytes)"

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_SSH_KEY}" ]]; then
            echo "::error::DEPLOY_SSH_KEY secret is empty."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          KEY_FILE="$HOME/.ssh/id_deploy"

          # Normalize common secret-pasting damage:
          #   - CRLF line endings
          #   - a UTF-8 or UTF-16 BOM (PowerShell redirects add one by default)
          #   - UTF-16 encoding (NUL padding between ASCII bytes)
          #   - leading indentation or trailing whitespace on each line
          #   - the whole key wrapped in double or single quotes
          #   - literal \n sequences instead of real newlines
          #   - stray blank lines
          #   - a missing newline after the final -----END----- line
          # The closing awk drops blank lines and guarantees the trailing
          # newline that OpenSSH requires on the last line.
          normalize() {
            tr -d '\r\0' \
              | sed -e '1s/^\xEF\xBB\xBF//' -e '1s/^\xFF\xFE//' -e '1s/^\xFE\xFF//' \
              | sed -e 's/\\n/\n/g' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              | sed -e "s/^[\"']//" -e "s/[\"']\$//" \
              | awk 'NF { print }'
          }

          printf '%s' "$DEPLOY_SSH_KEY" | normalize > "$KEY_FILE"

          # Some setups store the key base64-encoded as a single blob. If there
          # is no PEM header, try decoding once before giving up.
          if ! grep -q -- '-----BEGIN' "$KEY_FILE"; then
            if tr -d '\n' < "$KEY_FILE" | base64 -d 2>/dev/null | normalize > "$KEY_FILE.decoded" \
               && grep -q -- '-----BEGIN' "$KEY_FILE.decoded"; then
              echo "Secret was base64-encoded; decoded it."
              mv "$KEY_FILE.decoded" "$KEY_FILE"
            else
              rm -f "$KEY_FILE.decoded"
            fi
          fi

          # A copy/paste that missed the first and last lines leaves only the
          # base64 body. Re-attach the armor when that body really is a key.
          if ! grep -q -- '-----BEGIN' "$KEY_FILE"; then
            if tr -d '\n' < "$KEY_FILE" | base64 -d 2>/dev/null \
               | head -c 14 | grep -qa 'openssh-key-v1'; then
              echo "Secret was missing its BEGIN/END lines; re-attaching them."
              {
                echo '-----BEGIN OPENSSH PRIVATE KEY-----'
                cat "$KEY_FILE"
                echo '-----END OPENSSH PRIVATE KEY-----'
              } > "$KEY_FILE.armored"
              mv "$KEY_FILE.armored" "$KEY_FILE"
            fi
          fi
          chmod 600 "$KEY_FILE"

          key_is_encrypted() {
            # PEM/PKCS#1 marks encryption in the headers.
            if grep -q 'Proc-Type:.*ENCRYPTED\|DEK-Info:' "$KEY_FILE"; then
              return 0
            fi
            # OpenSSH format records the cipher/kdf in the decoded body.
            if head -n 1 "$KEY_FILE" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
              if sed -e '1d' -e '$d' "$KEY_FILE" | tr -d '\n' | base64 -d 2>/dev/null \
                 | head -c 128 | grep -qa 'bcrypt'; then
                return 0
              fi
            fi
            return 1
          }

          # An encrypted key is unusable by non-interactive ssh/scp, so strip the
          # passphrase up front when one was supplied.
          if key_is_encrypted; then
            if [[ -z "${DEPLOY_SSH_KEY_PASSPHRASE}" ]]; then
              echo "::error::DEPLOY_SSH_KEY is passphrase-protected but DEPLOY_SSH_KEY_PASSPHRASE is not set. Add that secret, or store an unencrypted key."
              exit 1
            fi
            if ! ssh-keygen -p -P "$DEPLOY_SSH_KEY_PASSPHRASE" -N '' -f "$KEY_FILE" >/dev/null 2>&1; then
              echo "::error::DEPLOY_SSH_KEY_PASSPHRASE did not decrypt DEPLOY_SSH_KEY."
              exit 1
            fi
            echo "Removed passphrase from the deploy key for non-interactive use."
          fi

          if ! KEYGEN_ERR="$(ssh-keygen -y -f "$KEY_FILE" 2>&1 >/dev/null </dev/null)"; then
            echo "::error::DEPLOY_SSH_KEY is not a usable OpenSSH private key after normalization."
            # Structural diagnostics only - no key material is printed.
            echo "--- diagnostics ---"
            echo "bytes: $(wc -c < "$KEY_FILE")  lines: $(wc -l < "$KEY_FILE")"
            echo "first line: $(head -n 1 "$KEY_FILE" | grep -o -- '-----BEGIN.*-----' || echo '(no BEGIN marker)')"
            echo "last line:  $(tail -n 1 "$KEY_FILE" | grep -o -- '-----END.*-----' || echo '(no END marker)')"
            if head -n 1 "$KEY_FILE" | grep -q '^ssh-\|^ecdsa-'; then
              echo "hint: this looks like a PUBLIC key - the secret must hold the PRIVATE key."
            fi
            if grep -q 'PuTTY-User-Key-File' "$KEY_FILE"; then
              echo "hint: this is a PuTTY .ppk - convert it with 'puttygen key.ppk -O private-openssh -o id_deploy'."
            fi
            echo "ssh-keygen said: ${KEYGEN_ERR}"
            exit 1
          fi
          echo "Deploy key loaded and validated."

          printf '%s\n' \
            'Host *' \
            '  IdentityFile ~/.ssh/id_deploy' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            '  ServerAliveInterval 30' \
            '  ServerAliveCountMax 6' \
            > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install cloudflared (for tunnel SSH)
        if: ${{ env.DEPLOY_USE_CLOUDFLARE == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Start Cloudflare SSH proxy
        if: ${{ env.DEPLOY_USE_CLOUDFLARE == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # cloudflared reads the service token from the environment, which keeps
          # it off the process command line.
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST}" ]]; then
            echo "::error::DEPLOY_HOST secret is empty."
            exit 1
          fi
          nohup cloudflared access tcp \
            --hostname "$DEPLOY_HOST" \
            --url "127.0.0.1:${CF_PROXY_PORT}" \
            > /tmp/cloudflared-deploy.log 2>&1 &
          echo $! > /tmp/cloudflared-deploy.pid

          for _ in $(seq 1 30); do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/${CF_PROXY_PORT}" 2>/dev/null; then
              echo "Cloudflare proxy listening on 127.0.0.1:${CF_PROXY_PORT}"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Cloudflare proxy did not come up on 127.0.0.1:${CF_PROXY_PORT}"
          cat /tmp/cloudflared-deploy.log || true
          exit 1

      - name: Resolve deploy target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_USE_CLOUDFLARE}" == "true" ]]; then
            TARGET_HOST="127.0.0.1"
            TARGET_PORT="${CF_PROXY_PORT}"
          else
            TARGET_HOST="${DEPLOY_HOST}"
            TARGET_PORT="${DEPLOY_PORT:-22}"
          fi
          if [[ -z "$TARGET_HOST" ]]; then
            echo "::error::DEPLOY_HOST secret is empty."
            exit 1
          fi
          {
            echo "TARGET_HOST=$TARGET_HOST"
            echo "TARGET_PORT=$TARGET_PORT"
          } >> "$GITHUB_ENV"

      - name: Add known host
        run: |
          set -euo pipefail
          for attempt in $(seq 1 5); do
            if ssh-keyscan -T 10 -p "$TARGET_PORT" "$TARGET_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null \
               && [[ -s "$HOME/.ssh/known_hosts" ]]; then
              echo "Host key collected on attempt $attempt"
              exit 0
            fi
            echo "ssh-keyscan attempt $attempt produced no host key; retrying..."
            sleep 3
          done
          echo "::error::Could not collect a host key from $TARGET_HOST:$TARGET_PORT"
          exit 1

      - name: Publish APK and metadata
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_TARGET_OS: ${{ secrets.DEPLOY_TARGET_OS }}
          DEPLOY_RELEASE_DIR: ${{ secrets.DEPLOY_RELEASE_DIR }}
          DEPLOY_ENV_PATH: ${{ secrets.DEPLOY_ENV_PATH }}
          DEPLOY_RESTART_CMD: ${{ secrets.DEPLOY_RESTART_CMD }}
          APP_UPDATE_DOWNLOAD_URL: ${{ secrets.APP_UPDATE_DOWNLOAD_URL }}
          APP_UPDATE_PUBLIC_METADATA: ${{ secrets.APP_UPDATE_PUBLIC_METADATA }}
          APP_UPDATE_PUBLIC_DOWNLOAD: ${{ secrets.APP_UPDATE_PUBLIC_DOWNLOAD }}
          # Workflow inputs go through the environment so that values containing
          # quotes or backticks cannot be injected into the shell command.
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          CHANGELOG: ${{ inputs.changelog }}
          CRITICAL: ${{ inputs.critical }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_USER}" ]]; then
            echo "::error::DEPLOY_USER secret is empty."
            exit 1
          fi

          export DEPLOY_HOST="$TARGET_HOST"
          export DEPLOY_PORT="$TARGET_PORT"

          bash scripts/publish-android-update.sh \
            --apk "$RELEASE_APK" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --changelog "$CHANGELOG" \
            --critical "$CRITICAL" \
            --target-os "${DEPLOY_TARGET_OS:-windows}" \
            --download-url "${APP_UPDATE_DOWNLOAD_URL:-https://api.alex-dyakin.com/api/app/download/latest}" \
            --public-metadata "${APP_UPDATE_PUBLIC_METADATA:-false}" \
            --public-download "${APP_UPDATE_PUBLIC_DOWNLOAD:-false}"

      - name: Tear down
        if: ${{ always() }}
        run: |
          set -uo pipefail
          if [[ -f /tmp/cloudflared-deploy.pid ]]; then
            kill "$(cat /tmp/cloudflared-deploy.pid)" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/id_deploy" "$HOME/.keystore/lexicon-release.jks"
